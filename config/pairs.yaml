# ═══════════════════════════════════════════════════════════════════════════
# STATISTICAL PAIRS CATALOGUE — 50 pairs
#
# These are NOT the computable linkages in universe.yaml. There is no formula
# that says what Pepsi should cost given Coca-Cola. The relationship has to be
# ESTIMATED and then TESTED, because two trending series look correlated
# whether or not anything connects them.
#
# `access` is about what you can actually do from a Groww account:
#   full        both legs tradeable, including the short side
#   long_only   both legs buyable, but the short leg needs F&O or intraday --
#               so the classic A - beta*B spread trade is NOT available overnight
#   none        at least one leg is unreachable from an Indian retail account
#
# Almost every equity pair here is long_only in practice. That does not make
# them worthless -- a divergence is still information, and the ratio can be
# expressed by overweighting one side. It does mean "net edge" on these is not
# a profit estimate.
#
# `breaks_when` is the field that matters most. Cointegration is a statement
# about the past. Every entry names the specific event that would end the
# relationship, because a pair trade that does not revert is not a losing trade,
# it is an unbounded one.
# ═══════════════════════════════════════════════════════════════════════════

pairs:

# ─── FX ─────────────────────────────────────────────────────────────────────

  - id: eurusd_gbpusd
    group: fx
    a: "EURUSD=X"
    b: "GBPUSD=X"
    access: none
    mechanism: >
      Both quote a European currency against the USD, so a large share of each
      move is the USD leg they share. Eurozone-UK trade dependency reinforces it.
    breaks_when: UK-specific shocks — a Bank of England divergence, or another Brexit-class event.

  - id: eurusd_usdchf
    group: fx
    a: "EURUSD=X"
    b: "USDCHF=X"
    access: none
    mechanism: >
      Near-mirror by construction: EUR/USD has USD in the denominator, USD/CHF
      in the numerator, and CHF tracks EUR closely through the SNB's management.
      One of the most reliable inverse relationships in FX.
    breaks_when: SNB policy shifts — the 2015 floor removal moved this 20%+ in minutes.

  - id: audusd_nzdusd
    group: fx
    a: "AUDUSD=X"
    b: "NZDUSD=X"
    access: none
    mechanism: >
      Trans-Tasman trade integration and shared exposure to Chinese demand.
      Historically among the highest correlations in liquid FX.
    breaks_when: RBA/RBNZ policy divergence, or a dairy-versus-iron-ore terms-of-trade split.

  - id: audusd_usdcad
    group: fx
    a: "AUDUSD=X"
    b: "USDCAD=X"
    access: none
    mechanism: >
      Both commodity currencies, quoted opposite ways round, so the raw
      correlation is negative. AUD carries metals and bulk, CAD carries crude.
    breaks_when: Oil and metals decoupling — common, and the usual cause of drift here.

  - id: audusd_gold
    group: fx
    a: "AUDUSD=X"
    b: "GC=F"
    access: none
    mechanism: >
      Australia is a major gold exporter, so AUD historically tracked bullion.
    breaks_when: >
      Already weakened. This relationship was strong through the 2010s and has
      decayed as AUD became more a China-growth proxy than a gold proxy. A good
      test case for whether the profiler detects a decayed relationship.

  - id: usdcad_wti
    group: fx
    a: "USDCAD=X"
    b: "CL=F"
    access: none
    mechanism: >
      Canada is a major oil exporter; higher crude strengthens CAD, pushing
      USD/CAD down. One of the more durable commodity-currency links.
    breaks_when: Widening WCS-WTI differentials, or pipeline capacity shocks.

  - id: usdjpy_us10y
    group: fx
    a: "USDJPY=X"
    b: "^TNX"
    access: none
    mechanism: >
      The clearest macro relationship on this list. USD/JPY is driven by the
      Fed-BoJ rate differential, so it tracks US 10-year yields closely.
    breaks_when: BoJ yield-curve-control changes, or risk-off flows into JPY overwhelming the carry.

  - id: eurjpy_gbpjpy
    group: fx
    a: "EURJPY=X"
    b: "GBPJPY=X"
    access: none
    mechanism: Both are JPY crosses and function as risk-on/risk-off barometers; they share the JPY leg.
    breaks_when: EUR-GBP divergence, which is itself a tradeable pair.

  - id: gbpusd_gbpjpy
    group: fx
    a: "GBPUSD=X"
    b: "GBPJPY=X"
    access: none
    mechanism: Shared GBP leg. GBP/JPY swings wider because JPY adds safe-haven flow.
    breaks_when: JPY-specific risk episodes decoupling the yen from the dollar.

  - id: usdmxn_wti
    group: fx
    a: "USDMXN=X"
    b: "CL=F"
    access: none
    mechanism: MXN as an EM commodity proxy tied to US oil demand and Mexican production.
    breaks_when: >
      Weaker than the CAD-oil link. MXN is heavily driven by carry and US
      political risk, both of which can swamp the oil channel entirely.

  - id: eurusd_eurgbp
    group: fx
    a: "EURUSD=X"
    b: "EURGBP=X"
    access: none
    mechanism: >
      A triangular identity in disguise: EURUSD = EURGBP x GBPUSD. Not a
      statistical relationship at all — it is arithmetic, and belongs with the
      validation linkages.
    breaks_when: Never. If this one drifts, the data is wrong.

  - id: usdsgd_usdcnh
    group: fx
    a: "USDSGD=X"
    b: "USDCNH=X"
    access: none
    mechanism: >
      The MAS manages SGD against a trade-weighted basket in which CNH carries
      heavy weight, making SGD a partial CNH proxy.
    breaks_when: PBoC fixing interventions, or an MAS policy-band reset.

  - id: usdzar_gold
    group: fx
    a: "USDZAR=X"
    b: "GC=F"
    access: none
    mechanism: South Africa is a major precious-metals exporter; gold strength supports ZAR.
    breaks_when: >
      Domestic South African risk — load-shedding, fiscal stress, political
      shocks — routinely overwhelms the commodity channel.

  - id: audjpy_spx
    group: fx
    a: "AUDJPY=X"
    b: "^GSPC"
    access: none
    mechanism: >
      The classic carry-trade proxy. Long high-yield AUD against low-yield JPY
      is a risk-on expression, so it tracks global equities.
    breaks_when: BoJ normalisation removing the yield differential the carry depends on.

# ─── INTERMARKET / INDEX ────────────────────────────────────────────────────

  - id: spx_ndx
    group: intermarket
    a: "^GSPC"
    b: "^NDX"
    access: none
    mechanism: >
      Overlapping top-weight constituents — Apple, Microsoft, Nvidia, Amazon —
      appear in both. NOT an identity: the Nasdaq is far more concentrated.
    breaks_when: Rotation between growth and value, which widens the spread for quarters at a time.

  - id: spx_vix
    group: intermarket
    a: "^GSPC"
    b: "^VIX"
    access: none
    mechanism: >
      Near-mechanical rather than statistical: VIX is computed FROM S&P option
      prices, so the inverse relationship is close to definitional.
    breaks_when: Rarely. Vol-of-vol events can briefly decouple level from change.

  - id: spx_rut
    group: intermarket
    a: "^GSPC"
    b: "^RUT"
    access: none
    mechanism: Large cap against small cap; the ratio tracks credit conditions and domestic growth.
    breaks_when: Credit tightening, which hits small caps disproportionately and persistently.

  - id: dax_stoxx
    group: intermarket
    a: "^GDAXI"
    b: "^STOXX50E"
    access: none
    mechanism: German large caps are a large weight in the Euro Stoxx 50, so the two overlap heavily.
    breaks_when: German-specific industrial shocks — energy costs, auto-sector disruption.

  - id: ftse_gbpusd
    group: intermarket
    a: "^FTSE"
    b: "GBPUSD=X"
    access: none
    mechanism: >
      Roughly 70% of FTSE 100 revenue is earned abroad, mostly in USD. A weaker
      pound mechanically inflates reported earnings, so the index rises.
    breaks_when: Domestic UK shocks hitting both together, which inverts the usual sign.

  - id: spx_dax
    group: intermarket
    a: "^GSPC"
    b: "^GDAXI"
    access: none
    mechanism: US markets lead European opens; a transatlantic lead-lag rather than a contemporaneous link.
    breaks_when: >
      Divergent monetary cycles. Note the sessions barely overlap, so daily
      closes compare prices struck hours apart — same alignment problem as ADRs.

  - id: asx_em
    group: intermarket
    a: "^AXJO"
    b: "EEM"
    access: none
    mechanism: Australia's mining and banking weight makes the ASX behave like an EM proxy.
    breaks_when: China-specific slowdowns hitting EM harder than Australian banks.

  - id: gold_silver
    group: intermarket
    a: "GC=F"
    b: "SI=F"
    access: none
    mechanism: >
      The gold-silver ratio. Same monetary driver, but silver carries heavy
      industrial demand and roughly double the volatility.
    breaks_when: Industrial demand shocks moving silver independently of monetary factors.

  - id: copper_spx
    group: intermarket
    a: "HG=F"
    b: "^GSPC"
    access: none
    mechanism: >
      "Dr Copper" as a global industrial demand indicator.
    breaks_when: >
      Treat with suspicion. The relationship is much weaker than its reputation,
      and equity indices are now dominated by companies with little industrial
      copper exposure.

  - id: wti_brent
    group: intermarket
    a: "CL=F"
    b: "BZ=F"
    access: none
    mechanism: >
      Two benchmarks for the same commodity. The spread reflects transport
      economics and US shale logistics — the tightest genuine spread on this list.
    breaks_when: Pipeline bottlenecks, US export policy changes, regional supply shocks.

# ─── US EQUITY PAIRS ────────────────────────────────────────────────────────

  - id: cvx_xom
    group: equity_us
    a: "CVX"
    b: "XOM"
    access: long_only
    mechanism: Integrated oil majors sharing crude exposure, refining margins and capital cycles.
    breaks_when: Divergent capex strategy, or a large acquisition by either.

  - id: ko_pep
    group: equity_us
    a: "KO"
    b: "PEP"
    access: long_only
    mechanism: The textbook consumer-staples pair; shared demand drivers and input costs.
    breaks_when: PepsiCo's snack business diverging from pure beverages — a slow, persistent drift.

  - id: v_ma
    group: equity_us
    a: "V"
    b: "MA"
    access: long_only
    mechanism: A duopoly on the same payment rails, tracking identical transaction volumes.
    breaks_when: Regulatory action against one, or divergent exposure to a single large market.

  - id: hd_low
    group: equity_us
    a: "HD"
    b: "LOW"
    access: long_only
    mechanism: Home-improvement retail, both tied to US housing, mortgage rates and renovation cycles.
    breaks_when: Divergent margin execution — this pair has drifted for extended periods on operations alone.

  - id: f_gm
    group: equity_us
    a: "F"
    b: "GM"
    access: long_only
    mechanism: Legacy US automakers sharing labour costs, steel inputs and cyclical demand.
    breaks_when: Divergent EV transition outcomes, or a strike hitting one.

  - id: jpm_bac
    group: equity_us
    a: "JPM"
    b: "BAC"
    access: long_only
    mechanism: Money-centre banks driven by the same yield curve and net interest margin dynamics.
    breaks_when: Credit events, or divergent trading-revenue exposure.

  - id: wmt_tgt
    group: equity_us
    a: "WMT"
    b: "TGT"
    access: long_only
    mechanism: Big-box retail sharing consumer data and supply chains.
    breaks_when: >
      Demographic divergence. Target skews higher-income and discretionary,
      Walmart defensive — so they separate sharply in a consumer downturn.

  - id: nvda_amd
    group: equity_us
    a: "NVDA"
    b: "AMD"
    access: long_only
    mechanism: Semiconductor rivals sharing wafer costs and AI capex demand.
    breaks_when: >
      ALREADY BROKEN. This pair diverged violently through the AI cycle as
      Nvidia captured a dominant share. Included deliberately as an example of a
      relationship the profiler should REJECT.

  - id: fdx_ups
    group: equity_us
    a: "FDX"
    b: "UPS"
    access: long_only
    mechanism: Logistics duopoly reflecting freight volumes, fuel costs and e-commerce.
    breaks_when: Contract losses — the Amazon in-housing shift hit UPS far harder than FedEx.

  - id: msft_aapl
    group: equity_us
    a: "MSFT"
    b: "AAPL"
    access: long_only
    mechanism: >
      Both mega-cap tech with heavy passive-index flow.
    breaks_when: >
      The weakest rationale in the catalogue. Enterprise cloud and consumer
      hardware are different businesses; "linked by institutional flows" is not
      a mechanism you can defend. Expect the profiler to reject it.

# ─── INDIA: SECTOR DUOPOLIES ────────────────────────────────────────────────

  - id: hdfc_icici
    group: india_sector
    a: "HDFCBANK.NS"
    b: "ICICIBANK.NS"
    access: long_only
    mechanism: >
      The two large private banks, driven by RBI policy, domestic credit growth
      and FII flows into Indian financials.
    breaks_when: >
      The 2023 HDFC-HDFC Bank merger is a structural break inside any window
      longer than ~2.5 years. Test post-merger data separately.

  - id: tcs_infy
    group: india_sector
    a: "TCS.NS"
    b: "INFY.NS"
    access: long_only
    mechanism: >
      IT services majors with near-identical exposure: US and European tech
      spending, and a USD revenue base against an INR cost base.
    breaks_when: Divergent large-deal wins, or margin execution gaps.

  - id: maruti_mm
    group: india_sector
    a: "MARUTI.NS"
    b: "M&M.NS"
    access: long_only
    mechanism: >
      Passenger-vehicle makers sharing consumer sentiment, auto-loan rates and
      steel input costs.
    breaks_when: SUV-versus-small-car mix shifts, which have driven long divergences.
    note: >
      SUBSTITUTED. The original suggestion was MARUTI vs TATAMOTORS, but
      TATAMOTORS.NS no longer exists — the 2025 demerger split it, and the
      successor TMPV.NS has about 24 sessions of history. That is far too short
      to cointegrate, and it is a live example of the structural-break risk in
      your own framework.

  - id: reliance_ongc
    group: india_sector
    a: "RELIANCE.NS"
    b: "ONGC.NS"
    access: long_only
    mechanism: >
      Both crude-linked, but from OPPOSITE sides: ONGC is an upstream producer
      that gains from high crude, Reliance a refiner and retailer whose margins
      can compress.
    breaks_when: >
      Expect this to fail cointegration. Reliance is now dominated by telecom
      and retail, so the energy channel explains a shrinking share of it.

  - id: apollo_fortis
    group: india_sector
    a: "APOLLOHOSP.NS"
    b: "FORTIS.NS"
    access: long_only
    mechanism: Hospital chains tracking urban healthcare spend, occupancy and diagnostics demand.
    breaks_when: Ownership changes at Fortis, or divergent expansion cycles.

# ─── INDIA: SUPPLY CHAIN / COST-PUSH ────────────────────────────────────────

  - id: maruti_motherson
    group: india_supply
    a: "MARUTI.NS"
    b: "MOTHERSON.NS"
    access: long_only
    mechanism: OEM against component supplier; order books follow vehicle volumes with a lag.
    breaks_when: >
      Motherson's large international acquisitions have progressively decoupled
      it from Indian OEM volumes.

  - id: ultracemco_dlf
    group: india_supply
    a: "ULTRACEMCO.NS"
    b: "DLF.NS"
    access: long_only
    mechanism: Cement supplier against real-estate developer; construction velocity drives cement volume.
    breaks_when: >
      A LEAD-LAG, not a contemporaneous link. Construction demand reaches cement
      volumes with a multi-quarter lag, so a same-day spread may find nothing.

  - id: indigo_bpcl
    group: india_supply
    a: "INDIGO.NS"
    b: "BPCL.NS"
    access: long_only
    mechanism: >
      Cost-push and inverse. ATF is roughly 40% of an airline's cost base, so
      crude strength that helps oil marketers hurts IndiGo's margins.
    breaks_when: Fuel-surcharge pass-through, or OMC marketing margins being administratively capped.

  - id: asianpaint_crude
    group: india_supply
    a: "ASIANPAINT.NS"
    b: "CL=F"
    access: long_only
    mechanism: >
      Decorative paints use crude derivatives — monomers and solvents — as key
      inputs, so crude spikes compress gross margin.
    breaks_when: Pricing power letting cost be passed through, which breaks the inverse relation.

  - id: hul_godrej
    group: india_supply
    a: "HINDUNILVR.NS"
    b: "GODREJCP.NS"
    access: long_only
    mechanism: FMCG competitors sharing rural demand exposure and palm-oil input costs.
    breaks_when: Divergent portfolio mix and differing rural-urban revenue splits.

# ─── INDIA: CORPORATE HOUSE ─────────────────────────────────────────────────

  - id: tatasteel_tatapower
    group: india_group
    a: "TATASTEEL.NS"
    b: "TATAPOWER.NS"
    access: long_only
    mechanism: >
      Shared group identity and domestic capex exposure.
    breaks_when: >
      Weak rationale. Steel is a global commodity cyclical, power is a regulated
      domestic utility. "Same promoter" is a sentiment channel, not an economic
      one. Expect rejection.

  - id: adanient_adaniports
    group: india_group
    a: "ADANIENT.NS"
    b: "ADANIPORTS.NS"
    access: long_only
    mechanism: Group flagships sharing debt structure, funding costs and investor perception.
    breaks_when: >
      The January 2023 short-seller episode is a violent structural break. Any
      window spanning it will produce a cointegration result that means nothing.

  - id: bajfinance_bajajfinserv
    group: india_group
    a: "BAJFINANCE.NS"
    b: "BAJAJFINSV.NS"
    access: long_only
    mechanism: >
      The strongest structural rationale among the Indian pairs: Finserv holds
      the controlling stake in Finance, so part of Finserv's value IS Finance.
    breaks_when: >
      The 2025 Bajaj Finance split and bonus issue is a mechanical break in the
      price series — check the data is adjusted before trusting any fit.

# ─── INDIA: INDEX / MACRO ───────────────────────────────────────────────────

  - id: nifty_banknifty
    group: india_index
    a: "^NSEI"
    b: "^NSEBANK"
    access: long_only
    mechanism: >
      Financials are over 30% of the Nifty 50, so a large part of Bank Nifty is
      literally inside the Nifty. Close to mechanical.
    breaks_when: Sector rotation out of financials — real, but historically mean-reverting.

  - id: niftyit_usdinr
    group: india_index
    a: "^CNXIT"
    b: "USDINR=X"
    access: long_only
    mechanism: >
      IT services earn in USD and spend in INR, so rupee depreciation is a direct
      earnings tailwind. One of the cleanest macro links in Indian equities.
    breaks_when: Demand shocks in US tech spending overwhelming the currency tailwind.

  - id: niftyfmcg_niftymetal
    group: india_index
    a: "^CNXFMCG"
    b: "^CNXMETAL"
    access: long_only
    mechanism: >
      Defensive against cyclical. The ratio is an economic-cycle expression
      rather than a mean-reverting spread.
    breaks_when: >
      Expect rejection as a PAIR. These are not cointegrated in any useful
      sense; the ratio trends with the cycle rather than reverting to a mean.
