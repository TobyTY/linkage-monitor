# ─────────────────────────────────────────────────────────────────────────────
# UNIVERSE — 15 linkages over 29 instruments
#
# Every pair here is present because its fair value is COMPUTABLE, not because
# the two prices happen to correlate. A correlation you cannot write down is a
# pattern you cannot defend.
#
# CATEGORIES. The same arithmetic means three different things:
#
#   validation    The relationship is a mathematical identity. These exist to
#                 prove the engine works against a known answer. If triangular
#                 FX shows a persistent 40bps "gap", the bug is mine.
#   observational The relationship is real but the legs are not both reachable
#                 from an Indian retail account. Net edge measures whether the
#                 linkage HOLDS. It is not a profit estimate.
#   tradeable     Both legs reachable from a demat account. Net edge means what
#                 it says.
#
# FRICTION, per side, NSE equity delivery, sourced:
#   STT                  0.1%        = 10 bps   (both sides)
#   Stamp duty           0.015%      = 1.5 bps  (BUY only)
#   Exchange txn charge  Rs 2.97/lakh= 0.297 bps
#   SEBI turnover fee    0.0001%     = 0.01 bps
#   GST                  18% on (brokerage + txn + SEBI); NOT on STT/stamp duty
#
#   Groww equity delivery: Rs 20 or 0.1%, WHICHEVER IS LOWER, min Rs 5.
#   The flat cap makes brokerage size-dependent in basis points:
#       Rs  20,000 trade -> 10.0 bps/side     Rs 1,00,000 -> 2.0 bps/side
#       Rs  50,000 trade ->  4.0 bps/side     Rs 5,00,000 -> 0.4 bps/side
#   Numbers below assume a REFERENCE TRADE OF Rs 1,00,000 per leg: 2 bps/side,
#   4 bps round trip, plus 18% GST = 4.72 bps. Change the assumption and the
#   friction changes -- which is the capacity question in miniature.
#
#
# RETAIL INR<->USD COST -- why fx_spread is 260 bps and not the 50 that stood
# here as a placeholder.
#
# Priced 13 Sep 2026 at USDINR 95.54 (yfinance USDINR=X, 12 Sep 2026 close),
# on the same REFERENCE TRADE OF Rs 1,00,000 per leg used everywhere else in
# this file, ROUND TRIP. Three charges, none of them avoidable:
#
#   1. Platform FX markup over interbank. India-facing platforms quote this in
#      paise per USD -- INDmoney 50-80, Vested 75-100, Interactive Brokers 1-5.
#      At the INDmoney midpoint of 65 paise:
#          0.65 / 95.54 = 68.0 bps per conversion -> 136.1 bps round trip.
#   2. GST on the conversion itself. CGST Rule 32(2) slab: taxable value is 1%
#      of the amount up to Rs 1 lakh (minimum Rs 250), then Rs 1,000 + 0.5% of
#      the excess to Rs 10 lakh. On Rs 1,00,000 the value is Rs 1,000, taxed at
#      18% = Rs 180 = 18.0 bps per conversion -> 36.0 bps round trip.
#   3. Outward remittance / SWIFT fee, Rs 500-1,000 plus 18% GST. Midpoint
#      Rs 750 x 1.18 = Rs 885 = 88.5 bps. Charged on the outward leg only. The
#      inward repatriation carries its own correspondent-bank cut, which is NOT
#      counted here -- so 260 is a floor, not a central estimate.
#
#      136.1 + 36.0 + 88.5 = 260.6 -> 260 bps.
#
# SIZE DEPENDENCE is the capacity question again. Charges 2 and 3 are flat, so
# the number moves hard with ticket size:
#       Rs   50,000 -> ~432 bps          Rs  5,00,000 -> ~171 bps
#       Rs 1,00,000 -> ~260 bps          Rs 25,00,000 -> ~146 bps
# Swapping INDmoney's markup for Interactive Brokers' 1-5 paise drops term 1
# from 136 to ~6 bps, giving ~131 bps at the Rs 1,00,000 reference.
#
# TCS IS DELIBERATELY EXCLUDED. Investment remittances under LRS attract 20%
# TCS above a cumulative Rs 10 lakh per tax year (Budget 2026 cut education,
# medical and tour remittances to 2%; investment was not cut). TCS is
# creditable against income tax, so it is a cash-flow cost and not a spread.
# Adding it to a bps friction number would be charging a refund as an expense.
# It constrains sizing, not whether a gap is real.
#
# THE MARKUP FIGURES ARE PUBLISHED RATES, NOT MEASURED ONES. They come from
# platform disclosures and third-party comparisons, some of them vendor-run.
# The first real conversion statement should replace term 1 with an observed
# number, and this block should record it.
#
# NONE OF THIS MAKES THE ADR PAIRS TRADEABLE. Groww withdrew its US-stocks
# offering entirely -- no new investment after 27 Feb 2024, withdrawals closed
# 30 Jun 2024 -- and converting an ADR into the local share needs the
# depositary regardless of broker. These six linkages stay `observational`.
# The number exists so the net-edge column is honest about what a gap would
# have to clear, not because the trade is available.
# CONVERSION CONSTANTS. Fit them with `python -m linkage.calibrate --all`.
# A constant 3% stale produces a permanent 3% "spread" that never reverts and
# looks exactly like a standing arbitrage.
#
# BUT THE FIT IS NOT ALWAYS THE BETTER NUMBER. Fitting on daily closes assumes
# both legs are struck at the same moment. For same-session pairs -- two NSE
# ETFs, an ETF against its index -- that holds, and the fitted value wins.
#
# For CROSS-SESSION pairs it does not. NSE closes at 10:00 UTC, NYSE at 21:00
# UTC, so every daily observation of an ADR pair contains eleven hours of
# overnight move. Fit a ratio on that and the AVERAGE overnight drift gets baked
# into the constant. INFY and ICICI are the proof: both ratios are confirmed in
# the companies' own 20-F filings (1:1 and 2:1), and substituting the fitted
# values made their spreads WORSE -- -192 to -321 bps, and -179 to -243 bps.
#
# So: use the filing where one exists, the fit only where it does not, and treat
# every ADR fit as carrying a timing bias it cannot see.
# ─────────────────────────────────────────────────────────────────────────────

_nse_delivery_friction: &nse_delivery
  stt: 20
  stamp_duty: 1.5
  exchange_txn: 0.6
  sebi_turnover: 0.02
  brokerage: 4.0          # Groww, Rs 1,00,000 reference trade, round trip
  gst: 0.83               # 18% on (brokerage + txn + SEBI)

_nse_plus_fx: &nse_plus_fx
  stt: 20
  stamp_duty: 1.5
  exchange_txn: 0.6
  sebi_turnover: 0.02
  brokerage: 4.0
  gst: 0.83
  fx_spread: 260          # Retail INR<->USD, round trip, Rs 1,00,000 ticket.
                          # Dominates these pairs. Arithmetic in the
                          # RETAIL INR<->USD COST note above.

linkages:

  # ═══ VALIDATION ═══════════════════════════════════════════════════════════
  # Triangular FX identities. INR/X must equal USDINR times USD/X, to within
  # the quoting spread. No fitted constants, no duty, no story -- if these do
  # not sit near zero, the engine is broken and nothing below it can be trusted.

  - id: eurinr_triangular
    category: validation
    kalman_delta: 1.0e-10   # identity: beta cannot drift, so the prior must not let it
    description: EURINR against USDINR x EURUSD. Exact identity.
    legs:
      cross:  { symbol: "EURINR=X", provider: yfinance }
      usdinr: { symbol: "USDINR=X", provider: yfinance }
      usdx:   { symbol: "EURUSD=X", provider: yfinance }
    fair_value: "usdinr * usdx"
    reference: cross
    friction_bps: {}
    alert: { warn_z: 3.0, alert_z: 4.0, min_net_edge_bps: 0, cooldown_minutes: 240 }

  - id: gbpinr_triangular
    category: validation
    kalman_delta: 1.0e-10   # identity: beta cannot drift, so the prior must not let it
    description: GBPINR against USDINR x GBPUSD. Exact identity.
    legs:
      cross:  { symbol: "GBPINR=X", provider: yfinance }
      usdinr: { symbol: "USDINR=X", provider: yfinance }
      usdx:   { symbol: "GBPUSD=X", provider: yfinance }
    fair_value: "usdinr * usdx"
    reference: cross
    friction_bps: {}
    alert: { warn_z: 3.0, alert_z: 4.0, min_net_edge_bps: 0, cooldown_minutes: 240 }

  - id: audinr_triangular
    category: validation
    kalman_delta: 1.0e-10   # identity: beta cannot drift, so the prior must not let it
    description: AUDINR against USDINR x AUDUSD. Exact identity.
    legs:
      cross:  { symbol: "AUDINR=X", provider: yfinance }
      usdinr: { symbol: "USDINR=X", provider: yfinance }
      usdx:   { symbol: "AUDUSD=X", provider: yfinance }
    fair_value: "usdinr * usdx"
    reference: cross
    friction_bps: {}
    alert: { warn_z: 3.0, alert_z: 4.0, min_net_edge_bps: 0, cooldown_minutes: 240 }

  - id: jpyinr_triangular
    category: validation
    kalman_delta: 1.0e-10   # identity: beta cannot drift, so the prior must not let it
    description: >
      JPYINR against USDINR / USDJPY. The inverted leg -- included precisely
      because it is the one a sign error would slip through.
    legs:
      cross:  { symbol: "JPYINR=X", provider: yfinance }
      usdinr: { symbol: "USDINR=X", provider: yfinance }
      usdjpy: { symbol: "USDJPY=X", provider: yfinance }
    fair_value: "usdinr / usdjpy"
    reference: cross
    friction_bps: {}
    alert: { warn_z: 3.0, alert_z: 4.0, min_net_edge_bps: 0, cooldown_minutes: 240 }

  # ═══ OBSERVATIONAL — ADRs ═════════════════════════════════════════════════
  # An Indian retail investor cannot convert between an ADR and the local share:
  # that needs the depositary and a broker with permissions, and outward
  # remittance sits under LRS with TCS. These measure whether the link holds.
  #
  # Note the two legs close at different times -- NSE at 10:00 UTC, NYSE at
  # 20:00 UTC -- so a daily "gap" always contains an overnight move. That is a
  # real limitation of daily data, not something the engine can subtract away.

  - id: infy_adr
    category: observational
    description: Infosys NYSE ADR against NSE. Ratio 1:1, confirmed in the FY2026 20-F.
    legs:
      local: { symbol: "INFY.NS",  provider: yfinance }
      adr:   { symbol: "INFY",     provider: yfinance }
      fx:    { symbol: "USDINR=X", provider: yfinance }
    fair_value: "adr * fx / adr_ratio"
    params: { adr_ratio: 1 }        # CONFIRMED in the 20-F. Do NOT replace with
                                    # the fitted 0.9875 -- see the cross-session note above.
    reference: local
    friction_bps: *nse_plus_fx
    alert: { warn_z: 1.8, alert_z: 2.5, min_net_edge_bps: 15, cooldown_minutes: 60 }

  - id: icici_adr
    category: observational
    description: ICICI Bank NYSE ADR against NSE. Ratio 2:1, confirmed in the 20-F.
    legs:
      local: { symbol: "ICICIBANK.NS", provider: yfinance }
      adr:   { symbol: "IBN",          provider: yfinance }
      fx:    { symbol: "USDINR=X",     provider: yfinance }
    fair_value: "adr * fx / adr_ratio"
    params: { adr_ratio: 2 }        # CONFIRMED in the 20-F. Fitted value 1.9874 is
                                    # biased by the NSE/NYSE close mismatch.
    reference: local
    friction_bps: *nse_plus_fx
    alert: { warn_z: 1.8, alert_z: 2.5, min_net_edge_bps: 15, cooldown_minutes: 60 }

  - id: hdfc_adr
    category: observational
    description: >
      HDFC Bank NYSE ADR against NSE. Ratio ASSERTED at 3 and probably stale --
      the post-merger implied gap sits near -5% where the other ADRs sit near
      -2%. Fit it.
    legs:
      local: { symbol: "HDFCBANK.NS", provider: yfinance }
      adr:   { symbol: "HDB",         provider: yfinance }
      fx:    { symbol: "USDINR=X",    provider: yfinance }
    fair_value: "adr * fx / adr_ratio"
    params: { adr_ratio: 3.0901 }   # FITTED (asserted 3, drift +3.00%)
    reference: local
    friction_bps: *nse_plus_fx
    alert: { warn_z: 1.8, alert_z: 2.5, min_net_edge_bps: 15, cooldown_minutes: 60 }

  - id: wipro_adr
    category: observational
    description: >
      Wipro NYSE ADR against NSE. Ratio ASSERTED at 1 and the observed gap sits
      OPPOSITE in sign to Infosys and ICICI, which no FX or timing story
      explains. Bonus issues have almost certainly moved it. Fit it.
    legs:
      local: { symbol: "WIPRO.NS", provider: yfinance }
      adr:   { symbol: "WIT",      provider: yfinance }
      fx:    { symbol: "USDINR=X", provider: yfinance }
    fair_value: "adr * fx / adr_ratio"
    params: { adr_ratio: 0.9729 }   # FITTED (asserted 1, drift -2.71%)
    reference: local
    friction_bps: *nse_plus_fx
    alert: { warn_z: 1.8, alert_z: 2.5, min_net_edge_bps: 15, cooldown_minutes: 60 }

  - id: drreddy_adr
    category: observational
    description: >
      Dr Reddy's NYSE ADR against NSE. Ratio ASSERTED at 1; the 2024 5:1 split
      makes this the single most likely stale constant in the file. Fit it.
    legs:
      local: { symbol: "DRREDDY.NS", provider: yfinance }
      adr:   { symbol: "RDY",        provider: yfinance }
      fx:    { symbol: "USDINR=X",   provider: yfinance }
    fair_value: "adr * fx / adr_ratio"
    params: { adr_ratio: 0.9856 }   # FITTED (asserted 1, drift -1.44%)
    reference: local
    friction_bps: *nse_plus_fx
    alert: { warn_z: 1.8, alert_z: 2.5, min_net_edge_bps: 15, cooldown_minutes: 60 }

  - id: indy_nifty
    category: observational
    description: >
      iShares India 50 (US) against Nifty 50 in USD. INDY tracks the Nifty 50
      itself rather than an MSCI proxy, so the relationship is mechanical -- but
      the US fund prices through US hours while Nifty is shut, so most of any
      intraday gap is the market's guess at tomorrow's open.
    legs:
      us:    { symbol: "INDY",     provider: yfinance }
      index: { symbol: "^NSEI",    provider: yfinance }
      fx:    { symbol: "USDINR=X", provider: yfinance }
    fair_value: "index / fx * units_per_index"
    params: { units_per_index: 0.1714 }  # FITTED (asserted 1 was 83% wrong)
    reference: us
    friction_bps: *nse_plus_fx
    alert: { warn_z: 2.0, alert_z: 3.0, min_net_edge_bps: 20, cooldown_minutes: 120 }

  # ═══ TRADEABLE ════════════════════════════════════════════════════════════
  # Both legs on NSE, both reachable from a Groww account.

  - id: gold_etf_pair
    category: tradeable
    description: >
      Nippon Gold ETF against SBI Gold ETF. Same underlying metal, two funds.
      Any divergence beyond the expense-ratio difference is pure tracking error
      and both legs are one tap apart in the same app. The cleanest genuinely
      actionable linkage in this file.
    legs:
      a: { symbol: "GOLDBEES.NS", provider: yfinance }
      b: { symbol: "SETFGOLD.NS", provider: yfinance }
    fair_value: "b * nav_ratio"
    params: { nav_ratio: 0.9694 }   # FITTED (asserted held, +0.05%)
    reference: a
    friction_bps: *nse_delivery
    alert: { warn_z: 2.5, alert_z: 3.5, min_net_edge_bps: 30, cooldown_minutes: 120 }

  - id: niftybees_index
    category: tradeable
    description: >
      Nippon Nifty 50 ETF against the index. Tests ETF tracking during live
      hours. The index leg is not directly tradeable, so treat the gap as a
      tracking-quality measure rather than a trade.
    legs:
      etf:   { symbol: "NIFTYBEES.NS", provider: yfinance }
      index: { symbol: "^NSEI",        provider: yfinance }
    fair_value: "index * units_per_index"
    params: { units_per_index: 0.011336 }  # FITTED
    reference: etf
    friction_bps: *nse_delivery
    alert: { warn_z: 2.5, alert_z: 3.5, min_net_edge_bps: 25, cooldown_minutes: 120 }

  - id: bankbees_index
    category: tradeable
    description: Nippon Bank ETF against Nifty Bank. Same shape as niftybees.
    legs:
      etf:   { symbol: "BANKBEES.NS", provider: yfinance }
      index: { symbol: "^NSEBANK",    provider: yfinance }
    fair_value: "index * units_per_index"
    params: { units_per_index: 0.010329 }  # FITTED
    reference: etf
    friction_bps: *nse_delivery
    alert: { warn_z: 2.5, alert_z: 3.5, min_net_edge_bps: 25, cooldown_minutes: 120 }

  # ═══ OBSERVATIONAL — METALS ═══════════════════════════════════════════════
  # The domestic ETF leg is tradeable; the COMEX leg is not reachable from an
  # Indian retail account, so the pair is observational. Its value is that the
  # standing gap has a KNOWN cause -- import duty and GST -- which makes it the
  # best available test of whether the friction ledger can account for a gap it
  # already understands.

  - id: goldbees_comex
    category: observational
    description: Nippon Gold ETF against COMEX gold in INR, with duty and GST.
    legs:
      etf:  { symbol: "GOLDBEES.NS", provider: yfinance }
      spot: { symbol: "GC=F",        provider: yfinance }
      fx:   { symbol: "USDINR=X",    provider: yfinance }
    fair_value: "spot * fx / 31.1035 * units_per_gram * (1 + import_duty) * (1 + gst)"
    params:
      units_per_gram: 0.01          # ASSERTED — fit it
      import_duty: 0.06             # verify against the current notification
      gst: 0.03
    reference: etf
    friction_bps: *nse_delivery
    alert: { warn_z: 2.0, alert_z: 3.0, min_net_edge_bps: 25, cooldown_minutes: 120 }

  - id: silverbees_comex
    category: observational
    description: Nippon Silver ETF against COMEX silver in INR, with duty and GST.
    legs:
      etf:  { symbol: "SILVERBEES.NS", provider: yfinance }
      spot: { symbol: "SI=F",          provider: yfinance }
      fx:   { symbol: "USDINR=X",      provider: yfinance }
    fair_value: "spot * fx / 31.1035 * units_per_gram * (1 + import_duty) * (1 + gst)"
    params:
      units_per_gram: 1.0           # ASSERTED — fit it
      import_duty: 0.06
      gst: 0.03
    reference: etf
    friction_bps: *nse_delivery
    alert: { warn_z: 2.0, alert_z: 3.0, min_net_edge_bps: 25, cooldown_minutes: 120 }
